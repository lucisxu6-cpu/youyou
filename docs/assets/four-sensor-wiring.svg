<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 665" role="img" aria-labelledby="title desc"><title id="title">四片压力模块的六组接线</title><desc id="desc">V组连接主板3V3及四片V，G组连接主板GND及四片G。四个独立信号组分别连接IO4与1号S、IO6与2号S、IO7与3号S、IO5与4号S。各组互不相连。图示不是实际孔位坐标。</desc><rect width="1000" height="665" rx="20" fill="#faf8f5"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><text x="36" y="44" font-size="24" font-weight="700" fill="#302d35">六个独立连通组</text><text x="36" y="76" font-size="17" fill="#6f6870">实心圆＝插一根线　空心圆＝空孔　每行内部相通，各行互不相连</text><text x="36" y="138" font-size="20" font-weight="600" fill="#b65559">V 供电组</text><line x1="300" y1="132" x2="900" y2="132" stroke="#b65559" stroke-width="4"/><circle cx="300" cy="132" r="9" fill="#b65559" stroke="#b65559" stroke-width="3"/><text x="300" y="110" text-anchor="middle" font-size="18" fill="#302d35">主板 3V3</text><circle cx="450" cy="132" r="9" fill="#b65559" stroke="#b65559" stroke-width="3"/><text x="450" y="110" text-anchor="middle" font-size="18" fill="#302d35">1号 V</text><circle cx="600" cy="132" r="9" fill="#b65559" stroke="#b65559" stroke-width="3"/><text x="600" y="110" text-anchor="middle" font-size="18" fill="#302d35">2号 V</text><circle cx="750" cy="132" r="9" fill="#b65559" stroke="#b65559" stroke-width="3"/><text x="750" y="110" text-anchor="middle" font-size="18" fill="#302d35">3号 V</text><circle cx="900" cy="132" r="9" fill="#b65559" stroke="#b65559" stroke-width="3"/><text x="900" y="110" text-anchor="middle" font-size="18" fill="#302d35">4号 V</text><text x="36" y="219" font-size="20" font-weight="600" fill="#536776">G 地线组</text><line x1="300" y1="213" x2="900" y2="213" stroke="#536776" stroke-width="4"/><circle cx="300" cy="213" r="9" fill="#536776" stroke="#536776" stroke-width="3"/><text x="300" y="191" text-anchor="middle" font-size="18" fill="#302d35">主板 GND</text><circle cx="450" cy="213" r="9" fill="#536776" stroke="#536776" stroke-width="3"/><text x="450" y="191" text-anchor="middle" font-size="18" fill="#302d35">1号 G</text><circle cx="600" cy="213" r="9" fill="#536776" stroke="#536776" stroke-width="3"/><text x="600" y="191" text-anchor="middle" font-size="18" fill="#302d35">2号 G</text><circle cx="750" cy="213" r="9" fill="#536776" stroke="#536776" stroke-width="3"/><text x="750" y="191" text-anchor="middle" font-size="18" fill="#302d35">3号 G</text><circle cx="900" cy="213" r="9" fill="#536776" stroke="#536776" stroke-width="3"/><text x="900" y="191" text-anchor="middle" font-size="18" fill="#302d35">4号 G</text><text x="36" y="300" font-size="20" font-weight="600" fill="#497e86">S1 信号组</text><line x1="300" y1="294" x2="900" y2="294" stroke="#497e86" stroke-width="4"/><circle cx="300" cy="294" r="9" fill="#497e86" stroke="#497e86" stroke-width="3"/><text x="300" y="272" text-anchor="middle" font-size="18" fill="#302d35">主板 IO4</text><circle cx="450" cy="294" r="9" fill="#497e86" stroke="#497e86" stroke-width="3"/><text x="450" y="272" text-anchor="middle" font-size="18" fill="#302d35">1号 S</text><circle cx="600" cy="294" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="600" y="272" text-anchor="middle" font-size="18" fill="#9b949a">空</text><circle cx="750" cy="294" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="750" y="272" text-anchor="middle" font-size="18" fill="#9b949a">空</text><circle cx="900" cy="294" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="900" y="272" text-anchor="middle" font-size="18" fill="#9b949a">空</text><text x="36" y="381" font-size="20" font-weight="600" fill="#497e86">S2 信号组</text><line x1="300" y1="375" x2="900" y2="375" stroke="#497e86" stroke-width="4"/><circle cx="300" cy="375" r="9" fill="#497e86" stroke="#497e86" stroke-width="3"/><text x="300" y="353" text-anchor="middle" font-size="18" fill="#302d35">主板 IO6</text><circle cx="450" cy="375" r="9" fill="#497e86" stroke="#497e86" stroke-width="3"/><text x="450" y="353" text-anchor="middle" font-size="18" fill="#302d35">2号 S</text><circle cx="600" cy="375" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="600" y="353" text-anchor="middle" font-size="18" fill="#9b949a">空</text><circle cx="750" cy="375" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="750" y="353" text-anchor="middle" font-size="18" fill="#9b949a">空</text><circle cx="900" cy="375" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="900" y="353" text-anchor="middle" font-size="18" fill="#9b949a">空</text><text x="36" y="462" font-size="20" font-weight="600" fill="#497e86">S3 信号组</text><line x1="300" y1="456" x2="900" y2="456" stroke="#497e86" stroke-width="4"/><circle cx="300" cy="456" r="9" fill="#497e86" stroke="#497e86" stroke-width="3"/><text x="300" y="434" text-anchor="middle" font-size="18" fill="#302d35">主板 IO7</text><circle cx="450" cy="456" r="9" fill="#497e86" stroke="#497e86" stroke-width="3"/><text x="450" y="434" text-anchor="middle" font-size="18" fill="#302d35">3号 S</text><circle cx="600" cy="456" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="600" y="434" text-anchor="middle" font-size="18" fill="#9b949a">空</text><circle cx="750" cy="456" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="750" y="434" text-anchor="middle" font-size="18" fill="#9b949a">空</text><circle cx="900" cy="456" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="900" y="434" text-anchor="middle" font-size="18" fill="#9b949a">空</text><text x="36" y="543" font-size="20" font-weight="600" fill="#497e86">S4 信号组</text><line x1="300" y1="537" x2="900" y2="537" stroke="#497e86" stroke-width="4"/><circle cx="300" cy="537" r="9" fill="#497e86" stroke="#497e86" stroke-width="3"/><text x="300" y="515" text-anchor="middle" font-size="18" fill="#302d35">主板 IO5</text><circle cx="450" cy="537" r="9" fill="#497e86" stroke="#497e86" stroke-width="3"/><text x="450" y="515" text-anchor="middle" font-size="18" fill="#302d35">4号 S</text><circle cx="600" cy="537" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="600" y="515" text-anchor="middle" font-size="18" fill="#9b949a">空</text><circle cx="750" cy="537" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="750" y="515" text-anchor="middle" font-size="18" fill="#9b949a">空</text><circle cx="900" cy="537" r="9" fill="#faf8f5" stroke="#497e86" stroke-width="3"/><text x="900" y="515" text-anchor="middle" font-size="18" fill="#9b949a">空</text><text x="36" y="592" font-size="19" font-weight="600" fill="#b65559">IO5 是信号引脚，不是 5V。V 组与 G 组不能短接。</text><text x="36" y="625" font-size="17" fill="#6f6870">本图表达接线关系，不指定实物孔位；1—4 号模块的身体位置在软件中配对。</text></g></svg>